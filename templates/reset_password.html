{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block body_id %}resetPassword{% endblock %}

{% block content %}
    <h2>Reset your password</h2>
    <form method="POST" action="{{ url_for('reset_password') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="password">Password</label>
        <input type="password" name="password" class="form-control" required>
        <br>
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" name="confirmPassword" class="form-control" required>
        <br>
        <button class="btn btn-primary w-100">Reset Password</button> <p style="text-align: center;"><a href="{{ url_for('login') }}">Cancel</a></p>
    </form>
    
{% endblock %}
    
{% block scripts %}
{% endblock %}
