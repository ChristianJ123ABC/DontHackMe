<!-- NAVBAR:

    <nav class="navbar navbar-translucent gap-4 md:navbar-expand w-50" style="margin: 0 auto;" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='uploads/logo.png') }}" alt="Logo" width="25" height="20" class="d-inline-block align-text-top">DontHackMe
            </a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup" aria-labelledby="navbarNavAltMarkupLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavAltMarkupLabel"> Menu </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body justify-content-center align-items">
                    <div class="nav navbar-nav  nav-underline gap-12 ">
                        {% if session.user_id %}
                            <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                            <a class="nav-link" href="#">URL Scanner</a>
                            <a class="nav-link" href="{{ url_for('password_generator') }}">Password Generator</a>
                            <a class="nav-link" href="{{ url_for('logout') }}">Log out</a>
                        {% elif request.endpoint == 'recovery_codes' or request.endpoint == 'register_2fa'%}
                            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                            <a class="nav-link" href="{{ url_for('password_generator') }}">Password Generator</a>
                        {% else %}
                            <a class="nav-link" href="#">Login</a>
                            <a class="nav-link" href="{{ url_for('logout') }}">Sign Up</a>
                            <a class="nav-link" href="{{ url_for('password_generator') }}">Password Generator</a>
                        {% endif %}
                    </div>
                </div>
            </dialog>
        </div>
    </nav>
