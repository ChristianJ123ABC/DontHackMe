{% extends "base.html" %}
{% block title %}Recovery Codes{% endblock %}
{% block body_id %}login{% endblock %}

{% block content %}
    <form method="POST" action="{{ url_for('recovery') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="code">Recovery Code (e.g. S2LN-D52M)</label>
        <input type="code" name="code" class="form-control">


        <button class="btn btn-primary w-100">Login</button>

    </form>


    <h3><a href="{{ url_for('login_2fa') }}">Back to authenticator code.</a></h3>

  
    
{% endblock %}
    
{% block scripts %}
{% endblock %}
