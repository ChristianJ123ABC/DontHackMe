{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block body_id %}register{% endblock %}

{% block content %}
    <form method="POST" action="{{ url_for('register') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">Email Address</label>
        <input type="email" name="email" class="form-control">
        <br>
        <label for="username">Username</label>
        <input type="text" name="username" class="form-control">
        <br>
        <label for="password">Password</label>
        <input type="password" name="password" class="form-control">
        <br>
        <button class="btn btn-primary w-100">Register</button>

    </form>


    <h3>Unsure on how to make a secure password / passphrase? 
        Click <a class="intro" href="{{ url_for('password_generator') }}">here</a> or on the top of the website</h3>
    
{% endblock %}
    
{% block scripts %}
{% endblock %}
