<!-- Flash Messages-->
<div class = "flash">
    {% with messages = get_flashed_messages(with_categories = true)%}
        {% if messages %}
            {% for category, message in messages %}
                <div class = "alert-{{ category }}"><h2>{{ message }}</h2></div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>
