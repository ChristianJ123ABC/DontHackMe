{% extends "base.html" %}
{% block title %}2FA Login{% endblock %}
{% block body_id %}2faLogin{% endblock %}

{% block content %}
    <form method="POST" action="{{ url_for('login_2fa') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="code">6 digit code from authenticator app</label>
        <input type="code" name="code" inputmode="numeric" maxlength="6" class="form-control">
        <br>
        <button class="btn btn-primary w-100">Login</button>

    </form>


    <h3>Lost access to your authenticator? Use one of your recovery codes <a href="{{ url_for('recovery')}}">here.</a></h3>

  
    
{% endblock %}
    
{% block scripts %}
{% endblock %}
