{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block body_id %}login{% endblock %}

{% block content %}
    
    <div class = "form">
        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <label for="email">Email Address</label>
            <input type="email" name="email" class="form-control">
            <br>
            <label for="password">Password</label>
            <input type="password" name="password" class="form-control">
            <br>
            <button class="btn btn-primary w-100">Login</button>
            <p style="text-align: center;"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
        </form>
    </div>


    <h2>Unsure on how to make a secure password / passphrase? 
        Click <a class="intro" href="{{ url_for('password_generator') }}">here</a> or on the top of the website</h2>

  
    
{% endblock %}
    
{% block scripts %}
{% endblock %}
